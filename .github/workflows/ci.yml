name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка линтеров
        run: pip install flake8

      - name: Проверка flake8 (с игнором)
        run: |
          flake8 app/ scripts/ \
          --max-line-length=120 \
          --ignore=E203,W503,E501,F401,F841

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/ml.txt
          pip install -r requirements/parse.txt
          pip install -r requirements/web.txt
          pip install pytest

      - name: Запуск тестов
        run: pytest

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Псевдо-деплой
        run: echo "Ready for deployment"