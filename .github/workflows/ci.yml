name: CI — тестирование и проверка

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Запуск тестов
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверка импорта модулей
        run: |
          python -c "import app; print('App imported successfully')"

  lint:
    name: Проверка форматирования кода
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка линтеров
        run: pip install flake8 black

      - name: Проверка синтаксиса (flake8)
        run: flake8 app/ scripts/ --max-line-length=120 --ignore=E203,W503

      - name: Проверка форматирования (black)
        run: black --check app/ scripts/